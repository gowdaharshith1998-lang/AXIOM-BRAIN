name: Bug report
description: Report a reproducible problem in AXIOM
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. Start backend with ...
        2. Start frontend with ...
        3. Navigate to ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend/API
        - Frontend/Studio
        - Ingest/connectors
        - Governance/policy
        - MCP/skills
        - Deployment/ops
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node/npm, browser, database URL shape, and deployment context.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets before attaching logs.
      render: shell
