# Dependabot - automated dependency update PRs (audit DEP-003).
# Covers the three ecosystems CI builds from: Python (uv.lock via pip),
# npm (frontend/package-lock.json), and the GitHub Actions in .github/workflows.
version: 2
updates:
  # Python dependencies. Dependabot reads pyproject.toml + uv.lock.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  # Frontend dependencies (frontend/package-lock.json).
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # The action versions pinned in the CI/CD workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
