# Pre-commit hooks for AXIOM-BRAIN (Phase 1 / P0-4 secret hygiene).
#
# Enable locally with:
#     pip install pre-commit
#     pre-commit install
#     pre-commit run --all-files   # one-off scan of the whole tree
#
# gitleaks blocks commits that contain credentials (API keys, tokens, the
# Fernet vault key, private keys, etc.). This is the on-disk guardrail that
# would have caught the live OpenAI key checked into .env.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: gitleaks (detect committed secrets)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=2048"]
