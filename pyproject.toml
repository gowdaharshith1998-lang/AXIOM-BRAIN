[project]
name = "axiom"
version = "0.2.0"
description = "AXIOM — the company brain"
requires-python = ">=3.13"
dependencies = [
    "cryptography",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic>=2.5",
    "python-dotenv",
    "python-multipart",
    "PyYAML",
    "httpx",
    "requests",
    "google-auth",
    "uuid-utils",
    "networkx>=3.6.1",
    # networkx.pagerank delegates to scipy/numpy at runtime (no hard dep in networkx
    # itself) — declare them explicitly so clean installs reproduce a working build.
    "numpy>=1.26",
    "scipy>=1.11",
    "mcp==1.9.4",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "responses",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
axiom = "axiom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
# Convert any hang into a failing test that NAMES the culprit (CI safety + diagnosis).
# thread method works with the sync TestClient/asyncio loops used in this suite.
timeout = 120
timeout_method = "thread"

[tool.mypy]
strict = true
files = ["src/axiom"]

[[tool.mypy.overrides]]
# anthropic is an optional runtime dependency (LLM fallback in HybridClassifier);
# it is lazily imported and absent in the default install.
module = "anthropic.*"
ignore_missing_imports = true
